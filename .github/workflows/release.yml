name: Release

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install NSIS
        continue-on-error: true
        run: choco install nsis --no-progress -y

      - name: Build the exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Build the installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\make_setup.ps1

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SabljaReader-Setup.exe
          generate_release_notes: true
