name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile the app
        run: python -m py_compile SabljaReader.py

      - name: Validate sources.json
        run: python -c "import json; json.load(open('sources.json', encoding='utf-8')); print('sources.json OK')"
